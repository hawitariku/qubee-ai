version: '3.8'

services:
  qubee-ai:
    build: .
    container_name: qubee-ai
    ports:
      - "8080:8080"
    volumes:
      - ./oromo_corpus.txt:/app/oromo_corpus.txt
      - ./user_feedback.json:/app/user_feedback.json
      - ./spell_checker.log:/app/spell_checker.log
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
