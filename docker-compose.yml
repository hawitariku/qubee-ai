version: '3.8'

services:
  qubee-ai:
    build: .
    container_name: qubee-ai
    ports:
      - "8082:8082"
    volumes:
      - ./oromo_corpus.txt:/app/oromo_corpus.txt
      - ./user_feedback.json:/app/user_feedback.json
      - ./spell_checker.log:/app/spell_checker.log
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8082/stats')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
