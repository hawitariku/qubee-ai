services:
  - type: web
    name: qubeessaa-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"   # torch 2.1.1 requires Python <=3.11
      - key: REDIS_URL
        fromService:
          type: redis
          name: qubeessaa-redis
          property: connectionString
